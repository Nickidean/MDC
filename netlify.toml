[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/monzo"
  to = "/monzo.html"
  status = 200

[[redirects]]
  from = "/dpworldtour"
  to = "/dpworldtour.html"
  status = 200

[[redirects]]
  from = "/handbook"
  to = "/handbook/"
  status = 301
  force = true

[[edge_functions]]
  path = "/handbook/*"
  function = "handbook-auth"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
